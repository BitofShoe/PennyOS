name: Bug report
description: Report a reproducible PennyOS issue.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a PennyOS issue. Please keep private memory, secrets, and personal chat contents out of public issues.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include commands, route, browser action, or prompt shape where relevant.
      placeholder: |
        1. Run ...
        2. Open ...
        3. Send ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or branch
      placeholder: codex/penny-installable-local-companion-release
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Windows + LM Studio
        - macOS/Linux + LM Studio
        - Static/code review only
        - Other
    validations:
      required: true
  - type: checkboxes
    id: modes
    attributes:
      label: Enabled modes
      options:
        - label: LAN sharing was enabled with `PENNY_LAN_SHARE=1`
        - label: Direct workspace writes were enabled with `PENNY_ENABLE_DIRECT_WORKSPACE_WRITES=1`
        - label: Private-network web fetches were enabled with `PENNY_WEB_ALLOW_PRIVATE_NET=1`
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or receipts
      description: Redact private data before posting.
